<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love U Arabi ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#3b003b,#000 70%);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
}

/* Floating words background */
.word{
    position:absolute;
    color:rgba(255,105,180,0.25);
    font-size:18px;
    animation:float 10s linear infinite;
    white-space:nowrap;
}

@keyframes float{
    0%{
        transform:translateY(110vh) rotate(0deg);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-20vh) rotate(360deg);
        opacity:0;
    }
}


/* Stars */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}


/* Heart */
.heart{
    width:220px;
    height:220px;
    background:#ff1744;
    position:relative;
    transform:rotate(-45deg);
    animation:beat 1.2s infinite;
    box-shadow:
    0 0 40px #ff1744,
    0 0 80px #ff1744;
}


.heart:before,
.heart:after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    background:#ff1744;
    border-radius:50%;
}

.heart:before{
    top:-110px;
    left:0;
}

.heart:after{
    left:110px;
    top:0;
}


@keyframes beat{
    0%,100%{
        transform:rotate(-45deg) scale(1);
    }
    50%{
        transform:rotate(-45deg) scale(1.12);
    }
}


/* Text inside heart */
.text{
    position:absolute;
    z-index:5;
    transform:rotate(45deg);
    width:260px;
    text-align:center;
    left:-20px;
    top:80px;
    color:white;
    font-size:28px;
    font-weight:bold;
    text-shadow:
    0 0 10px white,
    0 0 20px pink;
}

.small{
    display:block;
    font-size:15px;
    margin-top:10px;
    font-weight:normal;
}

</style>

</head>

<body>


<!-- Floating Love Words -->
<script>

for(let i=0;i<40;i++){

let word=document.createElement("div");

word.className="word";
word.innerHTML="I love u Arabi ❤️";

word.style.left=Math.random()*100+"%";
word.style.animationDuration=(5+Math.random()*8)+"s";
word.style.animationDelay=Math.random()*10+"s";
word.style.fontSize=(12+Math.random()*18)+"px";

document.body.appendChild(word);

}


// Stars

for(let i=0;i<100;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";
star.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(star);

}

</script>



<div class="heart">

<div class="text">
    I Love U
    <br>
    Arabi ❤️
    <span class="small">
        Forever & Always
    </span>
</div>

</div>


</body>
</html>
